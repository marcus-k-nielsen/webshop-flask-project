{% extends "base.html" %}

{% block content %}

<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 70vh;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        width: 320px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
    }

    .login-card h1 {
        margin-bottom: 25px;
        color: #3e2c23;
    }

    .login-card input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 14px;
    }

    .login-card input:focus {
        border-color: #6f4e37;
    }

    .login-card button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #6f4e37, #8b5e3c);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-card button:hover {
        transform: scale(1.03);
        background: linear-gradient(135deg, #5a3e2b, #6f4e37);
    }

    .error {
        color: red;
        margin-bottom: 15px;
        font-size: 14px;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h1>Login</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log ind</button>
        </form>
    </div>
</div>

{% endblock %}

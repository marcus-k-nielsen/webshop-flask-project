{% extends "base.html" %}

{% block content %}

<style>
    .login-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        min-height: 80vh;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
    }

    .login-card h1 {
        margin-bottom: 30px;
        color: #3e2c23;
        font-size: 28px;
    }

    .login-card input {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-size: 15px;
        outline: none;
        box-sizing: border-box; /* Vigtigt for at undgå overlap */
    }

    .login-card button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #6f4e37, #3e2c23);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .login-card button:hover {
        transform: scale(1.02);
    }

    /* Skillelinje */
    .divider {
        margin: 25px 0;
        border-top: 1px solid #eee;
        position: relative;
    }

    .divider span {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 0 10px;
        color: #999;
        font-size: 13px;
    }

    /* Register knap styling */
    .btn-register {
        display: block;
        width: 100%;
        padding: 12px;
        border: 2px solid #6f4e37;
        border-radius: 12px;
        color: #6f4e37;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn-register:hover {
        background-color: #f3e9dc;
    }

    .error {
        color: #a94442;
        background: #f2dede;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .register-link {
        margin-top: 15px;
        font-size: 14px;
        color: #6b4f3a;
    }

    .register-link a {
        color: #6f4e37;
        font-weight: bold;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h1>Login</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="email" name="username" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <div class="register-link">
            Don’t have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </div>
    </div>
</div>

{% endblock %}

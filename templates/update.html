{% extends "base.html" %}

{% block content %}

<style>
    .update-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        min-height: 80vh;
    }

    .update-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        width: 100%;
        max-width: 500px; /* Samme bredde som register-kortet */
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .update-card h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #3e2c23;
        font-size: 28px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px; /* Skaber luft mellem alle felter */
    }

    .form-full {
        grid-column: span 2;
    }

    /* Styling af labels, så de står pænt over felterne */
    .form-grid div {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    label {
        font-size: 13px;
        color: #3e2c23;
        font-weight: 600;
        margin-left: 5px;
    }

    .update-card input {
        width: 100%;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-size: 15px;
        outline: none;
        box-sizing: border-box; /* FIXER OVERLAP */
        transition: border-color 0.3s;
        background-color: #fcfcfc;
    }

    .update-card input:focus {
        border-color: #6f4e37;
        background-color: #fff;
    }

    .update-card button {
        width: 100%;
        padding: 14px;
        margin-top: 30px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #6f4e37, #3e2c23);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, background 0.3s;
    }

    .update-card button:hover {
        transform: scale(1.02);
        background: linear-gradient(135deg, #5a3e2b, #6f4e37);
    }
</style>

<div class="update-container">
    <div class="update-card">
        <h1>Update Profile</h1>

        {% if error %}
    <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/update">
            <div class="form-grid">
                
                <div>
                    <label>First Name</label>
                    <input type="text" name="firstname" value="{{ user_info[2] }}" required>
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" name="lastname" value="{{ user_info[3] }}" required>
                </div>

                <div class="form-full">
                    <label>Address</label>
                    <input type="text" name="address" value="{{ user_info[5] }}" required>
                </div>

                <div>
                    <label>ZIP</label>
                    <input type="text" name="zip" value="{{ user_info[6] }}" required>
                </div>

                <div>
                    <label>City</label>
                    <input type="text" name="city" value="{{ user_info[7] }}" required>
                </div>

                <div class="form-full">
                    <label>Country</label>
                    <input type="text" name="country" value="{{ user_info[8] }}" required>
                </div>

                <div class="form-full">
                    <label>Phone Number</label>
                    <input type="text" name="phone" value="{{ user_info[9] }}" required>
                </div>

                <div class="form-full">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ user_info[1] }}" required>
                </div>

                <div class="form-full">
                    <label>New Password (Optional)</label>
                    <input type="password" name="password" placeholder="Leave blank to keep current">
                </div>

            </div>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>

{% endblock %}
